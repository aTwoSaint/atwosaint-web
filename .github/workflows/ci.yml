name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # La CI no tiene base de datos: compila con el contenido de ejemplo.
      USE_SAMPLE_DATA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Solo dependencias de producción; las de desarrollo se revisan aparte.
      - run: npm audit --omit=dev --audit-level=high
