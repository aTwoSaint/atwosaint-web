# Actualizaciones automáticas de dependencias (npm y GitHub Actions): llegan como pull requests
# que pasan por la CI antes de poder fusionarse.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
